plugins {
    id 'com.gradleup.shadow' version '8.3.3'
    id 'me.modmuss50.mod-publish-plugin'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

base {
    archivesName = 'jamlib-neoforge'
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

repositories {
    maven {
        name = 'NeoForge'
        url = 'https://maven.neoforged.net/releases/'
    }
}

dependencies {
    neoForge libs.neoforge
    api libs.jankson
    shadowCommon libs.jankson
    forgeRuntimeLibrary libs.jankson

    common(project(path: ':common', configuration: 'mergedElements')) { transitive false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive false }
}

if (System.getenv('CURSEFORGE_API_KEY') != null && System.getenv('MODRINTH_API_KEY') != null) {
     publishMods {
         file = tasks.shadowJar.archiveFile
         displayName = "V${project.version} (NeoForge ${project.minecraft_version})"
         changelog = rootProject.file("CHANGELOG.md").text
         type = project.version.contains("beta") ? BETA : STABLE
         modLoaders.add("neoforge")

         curseforge {
             projectId = "623764"
             accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
             client = true
             server = true
             minecraftVersions.add(project.minecraft_version)
             minecraftVersions.addAll(project.additional_minecraft_versions == "" ? [] : project.additional_minecraft_versions.split(","))
         }

         modrinth {
             projectId = "IYY9Siz8"
             accessToken = providers.environmentVariable("MODRINTH_API_KEY")
             minecraftVersions.add(project.minecraft_version)
             minecraftVersions.addAll(project.additional_minecraft_versions == "" ? [] : project.additional_minecraft_versions.split(","))
         }
    }
}

configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = rootProject.base.archivesName.get() + '-neoforge'
            from components.java
        }
    }

    repositories {
        if (System.getenv('MAVEN_USERNAME') != null && System.getenv('MAVEN_PASSWORD') != null) {
            maven {
                url = 'https://maven.jamalam.tech/releases'
                credentials {
                    username = System.getenv('MAVEN_USERNAME')
                    password = System.getenv('MAVEN_PASSWORD')
                }
            }
        }
    }
}

processResources {
    def substitutions = [
            'version'             : project.version,
            'minecraft_version'   : project.minimum_minecraft_version,
            'neoforge_version'    : project.minimum_minecraft_version.substring(2),
    ]

    filesMatching('META-INF/neoforge.mods.toml') {
        expand substitutions
    }

    substitutions.each { inputs.property it.key, it.value }
}

jar {
    archiveClassifier = 'raw'
}

shadowJar {
    dependsOn(jar)
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null
}

sourcesJar {
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
